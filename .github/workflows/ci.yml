name: CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  test:
    # REL-1119 follow-up: this job used to be skipped for Dependabot with
    #   if: github.actor != 'dependabot[bot]'
    # and branch protection on main REQUIRES the contexts `test (20)` and
    # `test (22)` produced by this matrix. A skipped job never reports those
    # contexts, so every Dependabot PR was permanently unmergeable (PR #99
    # documents the same deadlock; PR #95 only landed via a human admin merge).
    #
    # The skip never provided any safety: this workflow runs on `pull_request`,
    # never on `pull_request_target`, so it has no repository secrets and no
    # write token, and a Dependabot PR's code cannot reach anything privileged
    # that an ordinary contributor PR could not. Removing it restores real
    # typecheck/coverage evidence on dependency bumps instead of accepting them
    # untested.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Public repo: every tracked file is a disclosure channel. Internal
      # addresses and hostnames fail here; RFC 5737 ranges are allowed.
      - name: Source scan for internal identifiers
        run: yarn scrub:source

      - name: Type check
        run: yarn typecheck

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 1

      - name: Prune superseded coverage artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NAME: coverage-node-${{ matrix.node-version }}
        run: |
          set -euo pipefail
          artifacts="$(gh api "repos/${REPO}/actions/artifacts?name=${NAME}&per_page=100" --jq '.artifacts[] | select(.expired == false) | .id' 2>/dev/null || true)"
          if [[ -n "$artifacts" ]]; then
            tail -n +3 <<< "$artifacts" | while IFS= read -r art_id; do
              [[ -z "$art_id" ]] && continue
              echo "Pruning superseded artifact ${art_id} (${NAME})"
              gh api -X DELETE "repos/${REPO}/actions/artifacts/${art_id}" >/dev/null 2>&1 || true
            done
          fi

      - name: Build
        run: yarn build

      # Scans exactly what `npm pack` would ship (build output included).
      - name: Publish scrub gate
        run: yarn scrub:publish

      # Proves the package packs and passes npm's publish-time checks on every
      # PR and merge-queue run, without touching the registry or any credential.
      - name: Publish dry run
        run: npm publish --dry-run --ignore-scripts --access public --provenance=false
