name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # REL-1119 follow-up: this job used to be skipped for Dependabot with
    #   if: github.actor != 'dependabot[bot]'
    # and branch protection on main REQUIRES the contexts `test (20)` and
    # `test (22)` produced by this matrix. A skipped job never reports those
    # contexts, so every Dependabot PR was permanently unmergeable (PR #99
    # documents the same deadlock; PR #95 only landed via a human admin merge).
    #
    # The skip never provided any safety: this workflow runs on `pull_request`,
    # never on `pull_request_target`, so it has no repository secrets and no
    # write token, and a Dependabot PR's code cannot reach anything privileged
    # that an ordinary contributor PR could not. Removing it restores real
    # typecheck/coverage evidence on dependency bumps instead of accepting them
    # untested.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn typecheck

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14
