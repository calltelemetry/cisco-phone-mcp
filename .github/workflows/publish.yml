name: Publish to npm

# Tokenless publish via npm trusted publishing (OIDC). There is no long-lived
# registry token: the npm registry trusts this exact workflow instead.
# One-time npm package setting (package -> Settings -> Trusted publisher):
#   organization/user: calltelemetry
#   repository:        cisco-phone-mcp
#   workflow filename: publish.yml
# Trusted publishing needs a GitHub-hosted runner and npm >= 11.5.1.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    # npm trusted publishing needs a GitHub-hosted runner. This repository is
    # public, where `ubuntu-latest` is 4 vCPU; the org runner cap is 2 vCPU, so
    # use the 1 vCPU `ubuntu-slim` (job limit 15 minutes).
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11.6.2 (trusted publishing)
        run: npm install --global npm@11.6.2

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Source scan and publish scrub
        run: yarn scrub:source && yarn scrub:publish

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
